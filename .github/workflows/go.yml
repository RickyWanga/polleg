# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: polleg
          POSTGRES_PASSWORD: polleg
          POSTGRES_DB: polleg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polleg -d polleg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.21

      - name: Build
        run: go build -v ./...

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Test
        env:
          POLLEG_TEST_DSN: host=localhost port=5432 user=polleg password=polleg dbname=polleg_test sslmode=disable
        run: go test -v ./...
